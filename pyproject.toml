# Packaging metadata for the *generator only*: it exposes the `python-repo`
# console script (uv tool install) and ships instantiate.py, copier.yml, and
# template/. The root still has no virtualenv or lock file; pinned Copier is its
# sole runtime dependency. Maintainer tooling is provisioned ephemerally by the
# justfile, while its policy lives here beside the packaging metadata.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-design-guardrails-pack"
version = "0.3.0"
description = "Generator CLI for the Python design-guardrails repository template"
requires-python = ">=3.14"
dependencies = ["copier==9.17.0"]

[project.scripts]
python-repo = "instantiate:cli"

[tool.hatch.build.targets.wheel]
include = ["instantiate.py", "copier.yml"]

# The template must sit next to instantiate.py and copier.yml in site-packages
# so Path(__file__).parent remains the Copier template root in editable and
# wheel installs. force-include bypasses ignore rules, so template/ ships
# verbatim (dotfiles and Jinja-templated directories included).
[tool.hatch.build.targets.wheel.force-include]
"template" = "template"

[tool.hatch.build.targets.sdist]
include = ["instantiate.py", "copier.yml", "template", "README.md"]

# Keep the pack and the repositories it generates on one Ruff policy. The root
# adds only path-shaped exceptions for its generator CLI and subprocess-heavy
# acceptance harness; downstream policy remains canonical in the template.
[tool.ruff]
line-length = 100
src = [
  ".",
  "scripts",
  "tests",
  "template/repoctl",
  "template/src",
  "template/tests",
  "template/verification",
  "template/scripts",
]
force-exclude = true

[tool.ruff.lint]
select = [
  # Defects and suspicious constructs.
  "A",
  "ASYNC",
  "B",
  "BLE",
  "DTZ",
  "E4",
  "E7",
  "E9",
  "F",
  "G",
  "LOG",
  "PGH",
  "PIE",
  "PLC",
  "PLE",
  "PLW",
  "RUF",
  "S",
  "W605",

  # Readable, modern Python.
  "C4",
  "ERA",
  "FBT",
  "FLY",
  "I",
  "N",
  "PT",
  "PTH",
  "RSE",
  "T10",
  "T20",
  "TID",
  "UP",

  # Visible public return contracts.
  "ANN201",
  "ANN204",
  "ANN205",
  "ANN206",

  # Complexity and unambiguous refactors.
  "C901",
  "PLR0206",
  "PLR1704",
  "PLR1716",
  "PLR1722",
  "PLR1733",
  "PLR1736",
  "PLR5501",

  # High-signal control-flow simplifications.
  "RET502",
  "RET503",
  "RET505",
  "RET506",
  "RET507",
  "RET508",
  "SIM101",
  "SIM103",
  "SIM109",
  "SIM110",
  "SIM112",
  "SIM113",
  "SIM115",
  "SIM118",
  "SIM201",
  "SIM202",
  "SIM208",
  "SIM210",
  "SIM211",
  "SIM220",
  "SIM221",
  "SIM222",
  "SIM223",
  "SIM300",
  "TRY002",
  "TRY004",
  "TRY201",
  "TRY203",
  "TRY400",
  "TRY401",

  # Validate hand-written TYPE_CHECKING blocks without creating new ones.
  "TC004",
  "TC005",
  "TC010",
]

[tool.ruff.lint.per-file-ignores]
# The root tests and generator run only controlled local commands. The generated
# repository keeps the narrower downstream subprocess policy below.
"tests/**/*.py" = ["ANN201", "S101", "S603", "S607"]
"tests/test_ownership_zones.py" = ["S701"]
"instantiate.py" = ["S603", "S607", "T201"]
"scripts/**/*.py" = ["T201"]
"scripts/release.py" = ["S603", "S607"]
"scripts/validate_pack.py" = ["C901", "S603", "S607"]
"template/tests/**/*.py" = ["ANN201", "S101"]
"template/verification/tests/**/*.py" = ["ANN201", "S101"]
"template/verification/repoctl/**/*.py" = ["ANN201", "S101"]
"template/scripts/**/*.py" = ["T201"]
"template/scripts/crosshair_gate.py" = ["S603"]
"template/scripts/doctor.py" = ["S603"]
"template/scripts/quality_gate.py.jinja" = ["S603"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-decorators = [
  "hypothesis.given",
  "icontract.ensure",
  "icontract.invariant",
  "icontract.require",
  "icontract.snapshot",
  "pytest.hookimpl",
]

[tool.ruff.lint.isort]
known-first-party = [
  "instantiate",
  "repoctl",
  "scripts",
  "tests",
  "verification",
]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

# The root ships the generator only (instantiate.py + scripts/). `template/` is
# an uninstantiated scaffold: it holds Jinja expressions and
# imports dependencies that are never installed at the root, so type-checking it
# in place is meaningless — its correctness is proven by generating a real
# project and running the full quality gate (`just validate`). Exclude it from
# analysis so the editor stops reporting expected scaffold errors; keep scripts/
# on the import path so first-party imports (validate_pack) resolve in tests.
[tool.basedpyright]
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "template"]
# "template" stays excluded from analysis (Jinja scaffold) but remains an
# import root so tests importing scripts.* (the guard modules) resolve.
extraPaths = ["scripts", "template"]
