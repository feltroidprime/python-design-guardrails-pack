# Packaging metadata for the *generator only*: it exposes the `python-repo`
# console script (uv tool install) and ships instantiate.py, copier.yml, and
# template/. The root still has no virtualenv or lock file; pinned Copier is its
# sole runtime dependency.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-design-guardrails-pack"
version = "0.3.0"
description = "Generator CLI for the Python design-guardrails repository template"
requires-python = ">=3.14"
dependencies = ["copier==9.17.0"]

[project.scripts]
python-repo = "instantiate:cli"

[tool.hatch.build.targets.wheel]
include = ["instantiate.py", "copier.yml"]

# The template must sit next to instantiate.py and copier.yml in site-packages
# so Path(__file__).parent remains the Copier template root in editable and
# wheel installs. force-include bypasses ignore rules, so template/ ships
# verbatim (dotfiles and Jinja-templated directories included).
[tool.hatch.build.targets.wheel.force-include]
"template" = "template"

[tool.hatch.build.targets.sdist]
include = ["instantiate.py", "copier.yml", "template", "README.md"]

# The root ships the generator only (instantiate.py + scripts/). `template/` is
# an uninstantiated scaffold: it holds Jinja expressions and
# imports dependencies that are never installed at the root, so type-checking it
# in place is meaningless — its correctness is proven by generating a real
# project and running the full quality gate (`just validate`). Exclude it from
# analysis so the editor stops reporting expected scaffold errors; keep scripts/
# on the import path so first-party imports (validate_pack) resolve in tests.
[tool.basedpyright]
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "template"]
# "template" stays excluded from analysis (Jinja scaffold) but remains an
# import root so tests importing scripts.* (the guard modules) resolve.
extraPaths = ["scripts", "template"]
