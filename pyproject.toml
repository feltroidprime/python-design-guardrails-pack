# Packaging metadata for the *generator only*: it exposes the `python-repo`
# console script (uv tool install) and ships instantiate.py plus template/
# verbatim. The root still has no virtualenv, no lock file, and no runtime
# dependencies — the generator stays standard-library-only.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-design-guardrails-pack"
version = "0.1.0"
description = "Generator CLI for the Python design-guardrails repository template"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
python-repo = "instantiate:cli"

[tool.hatch.build.targets.wheel]
include = ["instantiate.py"]

# The template must sit next to instantiate.py in site-packages so that
# Path(__file__).parent / "template" resolves in both editable and wheel
# installs. force-include bypasses ignore rules, so template/ ships verbatim
# (dotfiles and placeholder directories included).
[tool.hatch.build.targets.wheel.force-include]
"template" = "template"

[tool.hatch.build.targets.sdist]
include = ["instantiate.py", "template", "README.md"]
