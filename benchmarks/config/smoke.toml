# Cheap plumbing check for the benchmark harness: a trivial app, short
# timeouts, the same pipeline. Use this before spending money on default.toml.
# Run with: python3 benchmarks/run.py --config benchmarks/config/smoke.toml

[run]
output_root = "~/.local/share/guardrails-benchmark/runs"
label = "smoke"
seed = 0
keep_workspaces = true
run_native_gate = false
parallel_arms = true
headless_llm_path = "../../headless_llm"
install_timeout_seconds = 600.0
tests_timeout_seconds = 300.0
gate_timeout_seconds = 600.0

[project]
name = "greet"
package = "greet"

[template]
vcs_ref = "HEAD"
variant = "baseline"

[builder]
provider = "claude"
model = "claude-haiku-4-5-20251001"
effort = "medium"
timeout_seconds = 900.0
allowed_tools = [
  "Bash",
  "Read",
  "Write",
  "Edit",
  "Glob",
  "Grep",
  "TodoWrite",
  "BashOutput",
  "KillShell",
]

[prompt]
spec_file = "prompts/smoke_spec.md"
charter_file = "prompts/build_charter.md"

[judge]
timeout_seconds = 600.0
max_bundle_chars = 400000
max_file_chars = 40000
exclude = [
  "AGENTS.md",
  "CLAUDE.md",
  "architecture.toml",
  "justfile",
  "prek.toml",
  ".python-version",
  ".gitignore",
  ".copier-answers.yml",
  ".github/*",
  ".vscode/*",
  "docs/*",
  "scripts/*",
  "*.lock",
  "*.log",
]
# The generated template itself carries no pack-identifying wording (enforced
# by a bundle test); `redact = [...]` stays available for custom setups whose
# judged content needs masking.

[[judge.panel]]
provider = "codex"
model = "gpt-5.6-sol"
effort = "medium"

[[judge.panel]]
provider = "opencode"
model = "minimax/MiniMax-M3"
effort = "high"

[tools]
ruff = "0.15.21"
basedpyright = "1.39.9"
radon = "6.0.1"
coverage = "7.15.1"
ruff_select = "F,E,W,B"
ruff_ignore = "E501"

[[probes]]
name = "greets-by-name"
argv = ["uv", "run", "greet", "--name", "World"]
expect_exit = 0
stdout_regex = '(?m)^Hello, World!$'
timeout_seconds = 300.0

[[probes]]
name = "rejects-blank-name"
argv = ["uv", "run", "greet", "--name", ""]
expect_exit = 2
stderr_regex = '\S'

[[probes]]
name = "shouts"
argv = ["uv", "run", "greet", "--name", "World", "--shout"]
expect_exit = 0
stdout_regex = '(?m)^HELLO, WORLD!$'
