# A generated 50,000-row export-shaped CSV keeps the repository small while
# making replay-per-row / list-scan-per-row implementations miss the ceiling.
[[probes]]
name = "generate-streaming-scale-csv"
argv = [
  "uv", "run", "python", "-c",
  "import csv,sys; f=open(sys.argv[1],'w',encoding='utf-8',newline=''); w=csv.writer(f,lineterminator='\\n'); w.writerow(('id','title','note','deadline','state','created_at','updated_at')); w.writerows((i,'bulk-%d'%i,'','','queued','2026-04-01T00:00:00Z','2026-04-01T00:00:00Z') for i in range(1000,51000)); f.close()",
  "{db}.bulk.csv",
]
expect_exit = 0

[[probes]]
