# A generated 5,000-row export-shaped CSV keeps the repository small while
# making replay-per-row / list-scan-per-row implementations miss the ceiling.
[[probes]]
name = "generate-streaming-scale-csv"
argv = [
  "uv", "run", "python", "-c",
  "import csv,sys; f=open(sys.argv[1],'w',encoding='utf-8',newline=''); w=csv.writer(f,lineterminator='\\n'); w.writerow(('id','title','note','deadline','state','created_at','updated_at')); w.writerows((i,'bulk-%d'%i,'','','queued','2026-04-01T00:00:00Z','2026-04-01T00:00:00Z') for i in range(1000,6000)); f.close()",
  "{db}.bulk.csv",
]
expect_exit = 0

[[probes]]
name = "import-five-thousand-rows-within-linear-timeout"
argv = ["uv", "run", "relay", "--log", "{db}.bulk.log", "--now", "2026-04-01T13:00:00Z", "import", "--format", "csv", "--input", "{db}.bulk.csv"]
expect_exit = 0
stdout_regex = '\Aimported=5000 skipped=0\n?\Z'
timeout_seconds = 8.0

[[probes]]
name = "stats-after-streaming-import"
argv = ["uv", "run", "relay", "--log", "{db}.bulk.log", "--now", "2026-04-01T13:01:00Z", "stats"]
expect_exit = 0
stdout_regex = '\Aqueued=5000 running=0 done=0 failed=0 overdue=0\n?\Z'
