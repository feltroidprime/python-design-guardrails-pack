[[probes]]
name = "complete-event-log-has-exact-transition-semantics"
argv = ["uv", "run", "python", "-c", "import json,pathlib,sys; raw=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'); lines=raw.splitlines(); events=[json.loads(line) for line in lines]; types=['enqueued','started','completed','enqueued','started','failed','retried','enqueued','started','enqueued','started','failed']; ids=[1,1,1,2,2,2,2,3,3,4,4,4]; ats=['2026-04-01T10:00:00Z','2026-04-01T10:10:00Z','2026-04-01T10:20:00Z','2026-04-01T10:00:00Z','2026-04-01T10:05:00Z','2026-04-01T10:06:00Z','2026-04-01T10:07:00Z','2026-04-01T10:00:00Z','2026-04-01T10:08:00Z','2026-04-01T10:00:00Z','2026-04-01T10:08:00Z','2026-04-01T10:09:00Z']; payloads=[['Préparer café ☕','naïve, 東京','2026-04-01T09:00:00Z'],['retry me','','2026-04-01T09:30:00Z'],['still running','','2026-04-01T12:00:00Z'],['stays failed','','2026-04-01T08:00:00Z']]; enqueued=[event for event in events if event['type']=='enqueued']; transitions=[event for event in events if event['type']!='enqueued']; ok=raw==chr(10).join(json.dumps(event,ensure_ascii=False,separators=(',',':')) for event in events)+chr(10) and [event['type'] for event in events]==types and [event['job_id'] for event in events]==ids and [event['at'] for event in events]==ats and all(type(event['seq']) is int and event['seq']==i and type(event['job_id']) is int for i,event in enumerate(events,1)) and all(type(event['data']) is dict and list(event['data'])==['title','note','deadline'] for event in enqueued) and [list(event['data'].values()) for event in enqueued]==payloads and all(type(event['data']) is dict and len(event['data'])==0 for event in transitions); raise SystemExit(0 if ok else 1)", "{db}"]
