stdout_regex = '\Aexported=4\n?\Z'

[[probes]]
name = "json-export-has-exact-schema-and-encoding"
argv = ["uv", "run", "python", "-c", "import json,pathlib,sys; raw=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'); payload=json.loads(raw); jobs=payload.get('jobs'); expected=[[1,'Préparer café ☕','naïve, 東京','2026-04-01T09:00:00Z','done','2026-04-01T10:00:00Z','2026-04-01T10:20:00Z'],[2,'retry me','','2026-04-01T09:30:00Z','queued','2026-04-01T10:00:00Z','2026-04-01T10:07:00Z'],[3,'still running','','2026-04-01T12:00:00Z','running','2026-04-01T10:00:00Z','2026-04-01T10:08:00Z'],[4,'stays failed','','2026-04-01T08:00:00Z','failed','2026-04-01T10:00:00Z','2026-04-01T10:09:00Z']]; ok=list(payload)==['version','jobs'] and type(payload['version']) is int and payload['version']==1 and isinstance(jobs,list) and all(type(job['id']) is int and list(job)==['id','title','note','deadline','state','created_at','updated_at'] for job in jobs) and [list(job.values()) for job in jobs]==expected and raw==json.dumps(payload,ensure_ascii=False,separators=(',',':'))+'\\n'; raise SystemExit(0 if ok else 1)", "{db}.json"]
expect_exit = 0

