# Complementary real-app benchmark: event sourcing, a state machine, injected
# time, import/export idempotence, audit history, aggregation, and scale.
# Run with: python3 benchmarks/run.py --config benchmarks/config/relay.toml

[run]
output_root = "~/.local/share/guardrails-benchmark/runs"
label = "relay"
seed = 0
keep_workspaces = true
run_native_gate = true
parallel_arms = true
headless_llm_path = "../../headless_llm"
install_timeout_seconds = 600.0
tests_timeout_seconds = 600.0
gate_timeout_seconds = 1200.0

[project]
name = "relay"
package = "relay"

[template]
vcs_ref = "HEAD"
variant = "baseline"

[builder]
provider = "claude"
model = "claude-opus-4-8"
effort = "high"
timeout_seconds = 3600.0
allowed_tools = [
  "Bash",
  "Read",
  "Write",
  "Edit",
  "Glob",
  "Grep",
  "TodoWrite",
  "BashOutput",
  "KillShell",
]

[prompt]
spec_file = "prompts/relay_spec.md"
charter_file = "prompts/build_charter.md"

[judge]
timeout_seconds = 900.0
max_bundle_chars = 400000
max_file_chars = 40000
exclude = [
  "AGENTS.md",
  "CLAUDE.md",
  "architecture.toml",
  "justfile",
  ".pre-commit-config.yaml",
  ".python-version",
  ".gitignore",
  ".copier-answers.yml",
  ".github/*",
  ".vscode/*",
  "docs/*",
  "scripts/*",
  "*.lock",
  "*.log",
]

[[judge.panel]]
provider = "codex"
model = "gpt-5.6-sol"
effort = "high"

[[judge.panel]]
provider = "opencode"
model = "minimax/MiniMax-M3"
effort = "high"

[tools]
ruff = "0.15.21"
basedpyright = "1.39.9"
radon = "6.0.1"
coverage = "7.15.1"
ruff_select = "F,E,W,B"
ruff_ignore = "E501"

# Invalid input (exit 2) is checked before any successful mutation.
[[probes]]
name = "rejects-malformed-now"
argv = ["uv", "run", "relay", "--log", "{db}", "--now", "not-a-time", "stats"]
expect_exit = 2
stderr_regex = '\S'

[[probes]]
name = "rejects-noncanonical-now"
argv = ["uv", "run", "relay", "--log", "{db}", "--now", "2026-4-1T1:2:3Z", "stats"]
expect_exit = 2
stderr_regex = '\S'

[[probes]]
name = "rejects-malformed-deadline"
argv = [
  "uv", "run", "relay", "--log", "{db}", "--now", "2026-04-01T10:00:00Z",
  "enqueue", "--title", "bad", "--deadline", "2026-99-99T00:00:00Z",
]
expect_exit = 2
stderr_regex = '\S'

# Job 1 carries Unicode and becomes terminal.
[[probes]]
name = "enqueue-unicode-overdue-job"
argv = [
  "uv", "run", "relay", "--log", "{db}", "--now", "2026-04-01T10:00:00Z",
  "enqueue", "--title", "Préparer café ☕", "--note", "naïve, 東京",
  "--deadline", "2026-04-01T09:00:00Z",
]
expect_exit = 0
stdout_regex = '\A\s*id=\d+\s*\Z'
capture = [["id1", 'id=(\d+)']]

[[probes]]
name = "overdue-list-is-unicode-safe"
argv = [
  "uv", "run", "relay", "--log", "{db}", "--now", "2026-04-01T10:00:00Z",
  "list", "--overdue",
]
expect_exit = 0
stdout_regex = '(?m)^\d+\tqueued\t2026-04-01T09:00:00Z\t"Préparer café ☕"\t"naïve, 東京"$'

[[probes]]
name = "start-first-job"
argv = [
  "uv", "run", "relay", "--log", "{db}", "--now", "2026-04-01T10:10:00Z",
  "start", "--id", "{id1}",
]
expect_exit = 0
stdout_regex = '\A\s*\Z'

[[probes]]
name = "complete-first-job"
argv = [
  "uv", "run", "relay", "--log", "{db}", "--now", "2026-04-01T10:20:00Z",
  "done", "--id", "{id1}",
]
expect_exit = 0
stdout_regex = '\A\s*\Z'

[[probes]]
name = "terminal-job-rejects-retry"
argv = [
  "uv", "run", "relay", "--log", "{db}", "--now", "2026-04-01T10:30:00Z",
  "retry", "--id", "{id1}",
]
expect_exit = 4
stderr_regex = '\S'

[[probes]]
name = "history-exposes-append-only-events"
argv = [
  "uv", "run", "relay", "--log", "{db}", "--now", "2026-04-01T11:00:00Z",
  "history", "--id", "{id1}",
]
expect_exit = 0
stdout_regex = '(?s)\A1\t2026-04-01T10:00:00Z\tenqueued\tqueued\n2\t2026-04-01T10:10:00Z\tstarted\trunning\n3\t2026-04-01T10:20:00Z\tcompleted\tdone\n?\Z'

[[probes]]
name = "event-log-is-jsonl-and-globally-sequenced"
argv = ["uv", "run", "python", "-c", "import json,pathlib,sys; raw=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'); lines=raw.splitlines(); events=[json.loads(line) for line in lines]; ok=raw==chr(10).join(lines)+chr(10) and len(events)==3 and all(list(event)==['seq','at','type','job_id','data'] and type(event['seq']) is int and event['seq']==i and type(event['job_id']) is int for i,event in enumerate(events,1)) and [event['at'] for event in events]==['2026-04-01T10:00:00Z','2026-04-01T10:10:00Z','2026-04-01T10:20:00Z'] and [event['type'] for event in events]==['enqueued','started','completed'] and all(event['job_id']==1 for event in events) and type(events[0]['data']) is dict and list(events[0]['data'])==['title','note','deadline'] and list(events[0]['data'].values())==['Préparer café ☕','naïve, 東京','2026-04-01T09:00:00Z'] and all(type(event['data']) is dict and len(event['data'])==0 for event in events[1:]) and all(line==json.dumps(event,ensure_ascii=False,separators=(',',':')) for line,event in zip(lines,events,strict=True)); raise SystemExit(0 if ok else 1)", "{db}"]
expect_exit = 0

[[probes]]
name = "copy-log-for-independent-replay"
argv = ["uv", "run", "python", "-c", "import shutil,sys; shutil.copyfile(sys.argv[1],sys.argv[2])", "{db}", "{db}.replay"]
expect_exit = 0

[[probes]]
name = "copied-log-reconstructs-current-state"
argv = ["uv", "run", "relay", "--log", "{db}.replay", "--now", "2026-04-01T11:00:00Z", "list"]
expect_exit = 0
stdout_regex = '\A\d+\tdone\t2026-04-01T09:00:00Z\t"Préparer café ☕"\t"naïve, 東京"\n?\Z'

[[probes]]
name = "rejects-nonpositive-id-as-invalid-input"
argv = ["uv", "run", "relay", "--log", "{db}", "--now", "2026-04-01T11:00:00Z", "start", "--id", "0"]
expect_exit = 2
stderr_regex = '\S'

[[probes]]
name = "unknown-id-has-dedicated-exit"
argv = [
  "uv", "run", "relay", "--log", "{db}", "--now", "2026-04-01T11:00:00Z",
  "start", "--id", "999999",
]
expect_exit = 3
stderr_regex = '\S'

