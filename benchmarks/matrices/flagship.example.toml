# Twelve complete benchmark cells (2 builders x 2 apps x 3 seeds). Dry-run it
# and replace HEAD with a release tag before spending provider usage.
[run]
output_root = "~/.local/share/guardrails-benchmark/runs"
label = "opus-vs-tera"
headless_llm_path = "../../headless_llm"

[matrix]
apps = ["../config/default.toml", "../config/relay.toml"]
seeds = [1, 2, 3]
variants = ["baseline"]
repetitions = 1

[template]
vcs_ref = "HEAD"

[[builders]]
provider = "claude"
model = "claude-opus-4-8"

[[builders]]
provider = "codex"
model = "gpt-5.6-tera"
effort = "xhigh"

# This panel is fixed for the whole campaign and excludes both builder
# families (Claude and GPT).
[judge]

[[judge.panel]]
provider = "opencode"
model = "minimax/MiniMax-M3"
family = "minimax"

[[judge.panel]]
provider = "opencode"
model = "google/gemini-3.1-pro"
family = "google"

# Caps cover every provider call, including both arms and judge calls.
[concurrency]
claude = 2
codex = 2
opencode = 2
