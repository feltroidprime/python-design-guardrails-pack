# Experiment 1: one builder x two real apps x three seeds x two policy variants.
[run]
output_root = "~/.local/share/guardrails-benchmark/experiments/checks-discipline"
label = "checks-discipline"
headless_llm_path = "../../headless_llm"

[matrix]
apps = ["../../config/default.toml", "../../config/relay.toml"]
seeds = [1, 2, 3]
variants = ["baseline", "checks-via-commit"]
repetitions = 1

[template]
# Pin the template containing both answer sets for the entire paid campaign.
vcs_ref = "0a779837ea3f1fb63b0616d0d0c828f26947cef4"

[[builders]]
provider = "claude"
model = "claude-opus-4-8"
effort = "high"

# Both judges are family-disjoint from the Claude builder and fixed for all cells.
[judge]

[[judge.panel]]
provider = "codex"
model = "gpt-5.6-sol"
effort = "high"

[[judge.panel]]
provider = "opencode"
model = "minimax/MiniMax-M3"
effort = "high"
family = "minimax"

[concurrency]
claude = 2
codex = 2
opencode = 2
