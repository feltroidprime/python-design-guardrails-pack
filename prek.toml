minimum_prek_version = "0.4.9"
default_install_hook_types = ["pre-commit", "pre-push"]

# Local hooks only: the pack root is intentionally free of a virtualenv, a
# lock file, and remote hook pins. Both entries go through the justfile so
# the hook, the CLI, and CI always run the same commands.
[[repos]]
repo = "local"

# Fast feedback before each commit: render the complete default template, check
# version pins, and verify the hook routing.
[[repos.hooks]]
id = "pack-fast"
name = "pack fast checks (rendering, pins, hook policy)"
entry = "just test-fast"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-commit"]

# The complete root suite stays below the one-minute interaction budget.
# Canonical downstream validation remains mandatory through `just validate`
# and runs in CI rather than recursively inside every push.
[[repos.hooks]]
id = "pack-push"
name = "pack push checks (full root suite, <60s)"
entry = "just test"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-push"]
