minimum_prek_version = "0.4.9"
default_install_hook_types = ["pre-commit", "pre-push"]

# Local hooks only: the pack root is intentionally free of a virtualenv, a
# lock file, and remote hook pins. Both entries go through the justfile so
# the hook, the CLI, and CI always run the same commands.
[[repos]]
repo = "local"

# Fast feedback before each commit: render the complete default template, check
# version pins, and verify the hook routing. The complete suite runs pre-push.
[[repos.hooks]]
id = "pack-fast"
name = "pack fast checks (rendering, pins, hook policy)"
entry = "just test-fast"
language = "system"
pass_filenames = false
always_run = true

# Canonical validation before anything leaves the machine: fresh
# instantiation plus the generated repository's full quality gate
# (ruff, basedpyright, guards, import-linter, pytest).
[[repos.hooks]]
id = "pack-validate"
name = "pack validation (full downstream gate)"
entry = "just validate"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-push"]
