minimum_prek_version = "0.4.9"
default_install_hook_types = ["pre-commit", "pre-push"]

# Local hooks only: the pack root is intentionally free of a virtualenv, a
# lock file, and remote hook pins. Both entries go through the justfile so
# the hook, the CLI, and CI always run the same commands.
[[repos]]
repo = "local"

# Pack test suite: guard-rule tests plus a throwaway instantiation that runs
# the generated architecture guard, so a commit can never ship a template
# that fails its own rules.
[[repos.hooks]]
id = "pack-tests"
name = "pack tests (template guard + generator)"
entry = "just test"
language = "system"
pass_filenames = false
always_run = true

# Canonical validation before anything leaves the machine: fresh
# instantiation plus the generated repository's full quality gate
# (ruff, basedpyright, guards, import-linter, diagrams, pytest).
[[repos.hooks]]
id = "pack-validate"
name = "pack validation (full downstream gate)"
entry = "just validate"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-push"]
