name: quality

# User-owned shim. The gate itself is the pack-owned composite action at
# pack/ci/action.yml, which a pack update replaces whole.

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./pack/ci

  # The acceptance suite of #81 runs from the installed console script of a
  # freshly built wheel, so it is a separate job. The gate above runs
  # `-m "not acceptance"` and never reaches it (rule H3 of #85 section 5).
  # A Terminal Project carries neither the suite nor this job: projection
  # deletes the capability that holds them, and it replaces this file whole.
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.0"
          python-version: "3.14"
          enable-cache: true
      # `LEG-5` runs the gate, whose `tests` hook runs `just`. This job does not
      # call the composite action, so it repeats the pin of pack/ci/action.yml.
      # `pack/tests/test_pin_coherence.py` holds the two copies together.
      - run: |
          uv tool install "rust-just==1.57.0"
          uv tool dir --bin >> "$GITHUB_PATH"
        shell: bash
      - run: uv sync --locked --all-groups
        shell: bash
      - run: uv run pytest -c pack/configs/pytest.ini --rootdir=. -m acceptance
        shell: bash
