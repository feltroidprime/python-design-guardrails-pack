# The Pack Update. Its behavior is the same shape as the projection's: a
# filesystem effect over a whole tree, whose evidence is a comparison of two
# trees before and after one run. The `UPD` group of #81 is that evidence, and
# ticket I10 writes it into `tests/acceptance/` of this capability. The pure
# rules below are exempt for the same reason: each one states one clause of a
# `UPD` assertion, and the assertion measures the clause end to end.

