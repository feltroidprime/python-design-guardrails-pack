schema_version = 1

# The proof catalog of the One-shot Bootstrap.
#
# Every public behavior of a capability's `domain/` and `application/` layer is
# owned by a property or exempted here. This capability exempts all of them, for
# one reason and one reason only: its behavior is a filesystem effect over a
# whole tree, and the evidence for it is an end-to-end comparison of two trees,
# not a generated example.
#
# That evidence exists. It is the acceptance suite of #81: 53 assertions in six
# groups, run from the installed console script, which ticket I10 writes into
# `tests/acceptance/` of this capability. Terminal Projection deletes this
# capability, so neither the suite nor this catalog reaches a user's project.
#
# The revisit date is the date I10 must have made this catalog unnecessary by,
# or replaced these rows with properties of the pure rules in `domain/`.

[[exemptions]]
target = "guardrails_pack.bootstrap.domain.identity:Identity"
reason = "A two-value record with no behavior of its own."
revisit = "2027-08-05"

[[exemptions]]
target = "guardrails_pack.bootstrap.domain.identity:derive_package"
reason = "One separator swap, proved end to end by assertion PAR-9 of the acceptance suite."
revisit = "2027-08-05"

