schema_version: 1

run:
  id: guardrails-pack-spec0001-e3-v1
  epoch: 1
  predecessor_manifest_digest: null
  source_main_sha: c08c07128cd749721cb0987cf57a166917789b68
  base_ref: main
  max_concurrent: 3
  max_same_finding_rejections: 2
  max_review_rejections: 4
  require_ci: true

epic:
  id: feltroidprime/python-design-guardrails-pack#44
  outcome: >-
    A real agent-native control-plane CLI creates a DRAFT capability from an
    inspected plan, applies it exactly once, fails closed on a stale plan, and
    never writes an existing product file.
  success_metrics:
    - "`python -m repoctl capability plan NAME` writes a plan file and modifies nothing else in the repository."
    - Applying the same plan twice yields an already-applied result with no duplicated file or declaration.
    - Applying a plan whose base state changed fails with a structured recovery instruction and no partial write.
    - Every write performed by apply appears as an operation in the plan; a test detects a write that does not.
    - Every control-plane command runs as a detached process with closed stdin, emits JSON on stdout and diagnostics on stderr, and never prompts.
  non_goals:
    - Activation, retirement, and derived-index regeneration commands.
    - Removing the Item application or making the product CLI capability-driven.
    - The recursive N0 to N1 to N2 acceptance test and the application-shape fixtures.
    - A destructive purge operation.

models:
  planners:
    opus: {family: anthropic, model: claude-opus-5, effort: high}
    sol: {family: openai, model: gpt-5.6-sol, effort: max}
  workers:
    sonnet: {family: anthropic, model: claude-sonnet-5, effort: max}
    terra: {family: openai, model: gpt-5.6-terra, effort: max}
  reviewers:
    sol: {family: openai, model: gpt-5.6-sol, effort: xhigh}
    opus: {family: anthropic, model: claude-opus-5, effort: high}
  routing:
    planner_primary: opus
    planner_escalation: sol
    worker_default: terra
    worker_by_risk: {mechanical: sonnet, novel: terra}
    reviewer_by_worker: {sonnet: sol, terra: opus}

checks:
  - name: pack-tests
    command: [just, test]
  - name: pack-validate
    command: [just, validate]

protected_paths:
  - .agents/skills/**
  - benchmarks/**
  - docs/vendored/**
  - template/src/**
no_go_paths:
  - .venv/**
  - .jj/**
  - smithers.db
barriers: []

goal_tree:
  id: epic
  goal: >-
    Effects are explicit, inspectable, and reversible in intent: one port, two
    certified adapters, one journal, one plan-then-apply protocol, one CLI.
  children:
    - id: effect-seam
      goal: >-
        The repository filesystem seam is a single application-owned port with one
        reusable behavioral contract that every implementation must pass.
      children:
        - {id: task-repository-port-contract, task: repository_port_contract}
        - {id: task-in-memory-adapter, task: in_memory_adapter}
        - {id: task-local-filesystem-adapter, task: local_filesystem_adapter}
    - id: transaction
      goal: >-
        A write is a journaled transaction with compare-and-swap preconditions,
        deterministic order, and a verified result state; a stale plan fails
        closed rather than replanning silently.
      children:
        - {id: task-transaction-journal, task: transaction_journal}
        - {id: task-apply-use-case, task: apply_use_case}
        - {id: task-reference-state-machine, task: reference_state_machine}
    - id: control-plane-cli
      goal: >-
        The control CLI reuses the repository's existing agent-native command
        protocol and keeps the word "capability" unambiguous: control-plane
        commands describe capability modules, product commands describe the
        product's own catalog. Query commands come first so read paths are proven
        before any mutation is exposed.
      children:
        - {id: task-cli-query-commands, task: cli_query_commands}
        - {id: task-cli-mutation-commands, task: cli_mutation_commands}
        - {id: task-cli-process-contract, task: cli_process_contract}

tasks:
  repository_port_contract:
    repo: feltroidprime/python-design-guardrails-pack
    issue: feltroidprime/python-design-guardrails-pack#45
    outcome: >-
      An application-owned repository filesystem port exists together with one
      reusable behavioral contract suite that any implementation must pass to be
      certified.
    decision_boundary: >-
      Owns the port's method set, its error vocabulary, and the contract case
      list. May not implement any adapter, may not touch the domain layer, and may
      not add a method whose semantics only one adapter can satisfy.
    interfaces: [repository-port-v1, capability-plan-v1]
    uncertainty: high
    depends_on: []
    risk: novel
    lane:
      - template/repoctl/modules/repository_generation/application/ports.py
      - template/tests/repoctl/contract/repository_port_contract.py
    forbidden_paths: [template/repoctl/modules/repository_generation/domain/**]
    acceptance_criteria:
      - "The contract module defines one parameterized suite covering: absent-file creation, compare-and-swap success, compare-and-swap conflict, directory creation, normalized path handling, symlink escape rejection, interrupted transaction detection, journal recovery, and read-after-write consistency."
      - "`uv run pytest -q -m contract tests/repoctl` in a generated repository collects the suite and reports it as skipped or parameterized over zero implementations, not as an empty file."
      - "`uv run python -m scripts.architecture_guard` exits 0, and the port module imports nothing from adapters or bootstrap."
      - "A test asserts every port method is referenced by at least one contract case, so an unexercised method fails the pack."
    required_checks: [pack-tests, pack-validate]
    done_artifacts:
      - template/repoctl/modules/repository_generation/application/ports.py
      - template/tests/repoctl/contract/repository_port_contract.py

  in_memory_adapter:
    repo: feltroidprime/python-design-guardrails-pack
    issue: feltroidprime/python-design-guardrails-pack#46
    outcome: >-
      An in-memory repository implementation is certified against the full port
      contract and is usable as the deterministic fake for every downstream test.
    decision_boundary: >-
      Owns the in-memory representation and its concurrency model. May not change
      the port surface or the contract case list; a contract gap must be reported,
      not worked around.
    interfaces: [repository-port-v1]
    uncertainty: low
    depends_on: [repository_port_contract]
    risk: mechanical
    lane:
      - template/repoctl/modules/repository_generation/adapters/outbound/memory_repository.py
      - template/tests/repoctl/contract/test_memory_repository.py
    forbidden_paths: [template/repoctl/modules/repository_generation/application/ports.py]
    acceptance_criteria:
      - "`uv run pytest -q -m contract tests/repoctl/contract/test_memory_repository.py` passes with every contract case executed, not skipped."
      - "A test asserts the executed contract case count equals the case count declared by the shared suite."
      - "A compare-and-swap against a stale digest raises the port's named conflict error and leaves stored content unchanged, asserted by reading the value back."
      - "`just validate` passes."
    required_checks: [pack-tests, pack-validate]
    done_artifacts:
      - template/repoctl/modules/repository_generation/adapters/outbound/memory_repository.py

  local_filesystem_adapter:
    repo: feltroidprime/python-design-guardrails-pack
    issue: feltroidprime/python-design-guardrails-pack#47
    outcome: >-
      A local filesystem implementation is certified against the same port
      contract, including symlink escape rejection and interrupted-transaction
      detection on a real filesystem.
    decision_boundary: >-
      Owns the on-disk write strategy, temporary file placement, and fsync policy.
      May not change the port surface or the contract case list, and may not
      relax a case because a real filesystem makes it inconvenient.
    interfaces: [repository-port-v1]
    uncertainty: high
    depends_on: [repository_port_contract]
    risk: novel
    lane:
      - template/repoctl/modules/repository_generation/adapters/outbound/local_repository.py
      - template/tests/repoctl/contract/test_local_repository.py
    forbidden_paths: [template/repoctl/modules/repository_generation/application/ports.py]
    acceptance_criteria:
      - "`uv run pytest -q -m contract tests/repoctl/contract/test_local_repository.py` passes with every contract case executed against a real temporary directory."
      - "A test creates a symlink pointing outside the repository root and asserts the adapter refuses the write with its named escape error."
      - "A test truncates a staged transaction mid-write and asserts the adapter reports the transaction as interrupted rather than as complete."
      - "A test asserts the executed contract case count equals the count executed by the in-memory implementation."
    required_checks: [pack-tests, pack-validate]
    done_artifacts:
      - template/repoctl/modules/repository_generation/adapters/outbound/local_repository.py

  transaction_journal:
    repo: feltroidprime/python-design-guardrails-pack
    issue: feltroidprime/python-design-guardrails-pack#49
    outcome: >-
      Every apply runs as a journaled transaction under .repo/transactions/ with a
      deterministic operation order and a recoverable incomplete state.
    decision_boundary: >-
      Owns the journal record format, the transaction identifier, and the recovery
      classification. May not decide the apply protocol's step list or the plan
      schema, and may not write outside the declaration and derived zones.
    interfaces: [repository-port-v1, transaction-journal-v1, capability-plan-v1]
    uncertainty: high
    depends_on: [repository_port_contract, in_memory_adapter]
    risk: novel
    lane:
      - template/repoctl/modules/repository_generation/application/journal.py
      - template/tests/repoctl/unit/test_journal.py
    forbidden_paths: [template/repoctl/modules/repository_generation/adapters/**]
    acceptance_criteria:
      - "A test writes a transaction through the in-memory adapter and asserts the journal records the plan ID, the base-state digest, every operation in deterministic order, and a terminal completion marker."
      - "A test interrupts a transaction before its completion marker and asserts the journal classifies it as incomplete and names the operation it stopped at."
      - "Replaying a journal for an already-complete transaction produces no additional write, asserted by comparing the full stored state before and after."
      - "A test asserts the journal module performs no direct filesystem call and reaches storage only through the port."
    required_checks: [pack-tests, pack-validate]
    done_artifacts:
      - template/repoctl/modules/repository_generation/application/journal.py

  apply_use_case:
    repo: feltroidprime/python-design-guardrails-pack
    issue: feltroidprime/python-design-guardrails-pack#50
    outcome: >-
      apply(plan, port) executes the specification's ordered protocol, is
      idempotent on re-application, fails closed on a stale plan, and never writes
      an existing product file, owning REPOCTL::APPLY-IDEMPOTENT,
      REPOCTL::STALE-PLAN-REJECTED, and REPOCTL::PRODUCT-BYTES-PRESERVED.
    decision_boundary: >-
      Owns the ordering and failure behavior of the apply protocol and the
      structured outcome vocabulary including recovery guidance. May not change
      the plan schema, the port surface, or the journal format; may not silently
      replan.
    interfaces: [repository-port-v1, transaction-journal-v1, capability-plan-v1, apply-protocol-v1]
    uncertainty: high
    depends_on: [transaction_journal, local_filesystem_adapter]
    risk: novel
    lane:
      - template/repoctl/modules/repository_generation/application/use_cases.py
      - template/repoctl/modules/repository_generation/application/commands.py
      - template/proof/repoctl/repository-generation-apply.toml
      - template/verification/repoctl/test_apply_state_machine.py
    forbidden_paths: [template/repoctl/modules/repository_generation/domain/**]
    acceptance_criteria:
      - "REPOCTL::APPLY-IDEMPOTENT, REPOCTL::STALE-PLAN-REJECTED, and REPOCTL::PRODUCT-BYTES-PRESERVED appear in `uv run python -m scripts.proof_guard --report` with hypothesis-stateful evidence."
      - "`just prove-one REPOCTL::APPLY-IDEMPOTENT` passes, and re-applying a successful plan returns an already-applied outcome with an unchanged full-state digest."
      - "A test mutates the repository after planning and asserts apply returns a stale-plan failure whose structured outcome contains the recovery instruction, with a full-state digest identical to before the attempt."
      - "A mutation canary test writes to an existing product file through apply and asserts the attempt is refused; removing the refusal makes the test fail."
      - "A test asserts the set of paths written on disk during apply equals the set of operation target paths in the plan."
    required_checks: [pack-tests, pack-validate]
    done_artifacts:
      - template/repoctl/modules/repository_generation/application/use_cases.py

  reference_state_machine:
    repo: feltroidprime/python-design-guardrails-pack
    issue: feltroidprime/python-design-guardrails-pack#52
    outcome: >-
      One independent RuleBasedStateMachine models capability status, declaration
      state, product file hashes, index membership, and applied plan IDs, and
      shrinks any violation to a minimal action sequence.
    decision_boundary: >-
      Owns the model's state variables, its rule set, and its invariant list. May
      not reuse production code as its model, and may not weaken an invariant to
      make a run pass.
    interfaces: [apply-protocol-v1, transaction-journal-v1]
    uncertainty: high
    depends_on: [apply_use_case]
    risk: novel
    lane:
      - template/verification/repoctl/test_repository_state_machine.py
      - template/verification/harness/repository_model.py
    forbidden_paths: [template/repoctl/**]
    acceptance_criteria:
      - "`HYPOTHESIS_PROFILE=fast uv run pytest -q -m stateful verification/repoctl/test_repository_state_machine.py` passes."
      - "The machine implements rules for: plan capability, apply valid plan, apply same plan again, apply stale plan, manually modify product file, add second capability, and regenerate indexes."
      - "The machine asserts the invariants: existing product bytes never change, successful plan IDs are not applied twice, and no path exists outside allowed roots."
      - "A deliberate mutation that lets apply overwrite a product file makes the machine fail, and the reported counterexample is at most four steps long."
      - "A test asserts the model module imports nothing from repoctl's application or domain layers."
    required_checks: [pack-tests, pack-validate]
    done_artifacts:
      - template/verification/repoctl/test_repository_state_machine.py

  cli_query_commands:
    repo: feltroidprime/python-design-guardrails-pack
    issue: feltroidprime/python-design-guardrails-pack#48
    outcome: >-
      `python -m repoctl capabilities` and `python -m repoctl status` return
      versioned JSON envelopes describing declared capability modules and
      repository state, without modifying the repository.
    decision_boundary: >-
      Owns the control-plane command names, envelope version, and query pagination
      defaults, within the naming decision recorded on this branch's parent node.
      May not implement any mutating command and may not fork the existing command
      protocol types.
    interfaces: [repository-port-v1, repoctl-cli-v1, derived-index-v1]
    uncertainty: medium
    depends_on: [local_filesystem_adapter]
    risk: novel
    lane:
      - template/repoctl/modules/repository_generation/adapters/inbound/cli.py
      - template/repoctl/modules/repository_generation/adapters/inbound/cli_catalog.py
      - template/repoctl/bootstrap.py
      - template/repoctl/__main__.py
      - template/tests/repoctl/integration/test_cli_queries.py
    forbidden_paths: [template/src/**]
    acceptance_criteria:
      - "In a generated repository, `uv run python -m repoctl capabilities` exits 0 and prints a JSON object containing a schema version and an empty capability list."
      - "`uv run python -m repoctl status` exits 0 and prints a JSON object containing the repository schema version and the counts of draft, active, and retired capabilities."
      - "A test captures the full-state digest before and after both commands and asserts it is unchanged."
      - "`uv run python -m repoctl capabilities --limit 1` returns at most one entry and a continuation token, and an out-of-range limit fails with a structured error on stderr while stdout stays empty."
      - "A test asserts the control-plane command specs are validated by the same command-protocol types the product CLI uses."
    required_checks: [pack-tests, pack-validate]
    done_artifacts:
      - template/repoctl/__main__.py

  cli_mutation_commands:
    repo: feltroidprime/python-design-guardrails-pack
    issue: feltroidprime/python-design-guardrails-pack#51
    outcome: >-
      `python -m repoctl capability plan NAME` writes an inspectable plan without
      touching the repository, and `python -m repoctl capability apply PLAN`
      creates a DRAFT capability capsule exactly once.
    decision_boundary: >-
      Owns the mutation commands' arguments, their retry and safety declarations,
      and the capsule's seeded file set. May not seed a fake entity, fake port,
      fake test, or NotImplementedError business method, and may not change the
      apply protocol.
    interfaces: [repoctl-cli-v1, apply-protocol-v1, capability-plan-v1]
    uncertainty: medium
    depends_on: [apply_use_case, cli_query_commands]
    risk: novel
    lane:
      - template/repoctl/modules/repository_generation/adapters/inbound/cli_mutations.py
      - template/repoctl/modules/repository_generation/adapters/inbound/cli_outcomes.py
      - template/tests/repoctl/integration/test_cli_mutations.py
    forbidden_paths: [template/src/**]
    acceptance_criteria:
      - "In a generated repository, `uv run python -m repoctl capability plan alpha --inbound python --output .repo/plans/alpha.json` exits 0, writes that file, and a full-state digest taken excluding that file is unchanged."
      - "`uv run python -m repoctl capability apply .repo/plans/alpha.json` exits 0, and the resulting capability declaration has status draft."
      - "Running the same apply a second time exits 0 with an already-applied outcome, and the repository's full-state digest is identical to after the first apply."
      - "`uv run python -m scripts.capability_validator --root src/<package>/modules/alpha` exits 0 on the generated capsule."
      - "A test greps the generated capsule and asserts it contains no NotImplementedError, no class whose name matches a business entity pattern, and no test that asserts True."
    required_checks: [pack-tests, pack-validate]
    done_artifacts:
      - template/repoctl/modules/repository_generation/adapters/inbound/cli_mutations.py

  cli_process_contract:
    repo: feltroidprime/python-design-guardrails-pack
    issue: feltroidprime/python-design-guardrails-pack#53
    outcome: >-
      Every control-plane command has independent detached-process evidence
      covering its success envelope, its diagnostics stream, and each of its
      declared failure outcomes.
    decision_boundary: >-
      Owns the process case list and the harness that runs commands detached with
      closed stdin. May not change any command's behavior; a defect found here is
      reported as a finding against the owning leaf.
    interfaces: [repoctl-cli-v1]
    uncertainty: medium
    depends_on: [cli_mutation_commands]
    risk: mechanical
    lane:
      - template/tests/repoctl/contract/cli_process_cases.py
      - template/tests/repoctl/contract/test_repoctl_cli_contract.py
    forbidden_paths: [template/repoctl/**]
    acceptance_criteria:
      - "`uv run pytest -q -m contract tests/repoctl/contract/test_repoctl_cli_contract.py` passes with every case running the command as a detached subprocess with stdin closed."
      - "The case list covers: default JSON output, stable envelope, stdout and stderr separation, absence of prompting, unknown command, invalid schema, stale plan, path conflict, already-applied result, and a bounded capabilities query."
      - "A test asserts every command in the control-plane catalog has at least one process case, and adding a command without a case fails the pack."
      - "A test asserts stdout parses as JSON for every success case and that stderr is empty for every success case."
    required_checks: [pack-tests, pack-validate]
    done_artifacts:
      - template/tests/repoctl/contract/test_repoctl_cli_contract.py
