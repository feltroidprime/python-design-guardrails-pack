schema_version: 1

run:
  id: guardrails-pack-spec0001-e5-v1
  epoch: 1
  predecessor_manifest_digest: null
  source_main_sha: c08c07128cd749721cb0987cf57a166917789b68
  base_ref: main
  max_concurrent: 3
  max_same_finding_rejections: 2
  max_review_rejections: 4
  require_ci: true

epic:
  id: feltroidprime/python-design-guardrails-pack#63
  outcome: >-
    Pack CI certifies that a generated repository generates its own successors
    across five application shapes, that independent capability order does not
    matter, and that product bytes survive generation, retirement, and a
    foundation update.
  success_metrics:
    - The recursive acceptance test executes the specification's nineteen steps from template to N0 to N1 to N2 and passes in CI.
    - All five application-shape fixtures are created through the real control-plane CLI, never by writing files directly.
    - Applying two independent capabilities in either order produces the same canonical final state.
    - Every one of the fourteen mandatory mutations is caught, and the suite records which deterministic mechanism caught each.
    - The performance budgets in the specification are measured and recorded for a repository holding one hundred capabilities.
  non_goals:
    - Changing any planner, apply, lifecycle, or index-compilation behavior.
    - Shipping any fixture in a generated repository; fixtures are test-only.
    - Implementing the reserved update plan, apply, status, and recover commands.
    - Adding a new guardrail or relaxing an existing ceiling.

models:
  planners:
    opus: {family: anthropic, model: claude-opus-5, effort: high}
    sol: {family: openai, model: gpt-5.6-sol, effort: max}
  workers:
    sonnet: {family: anthropic, model: claude-sonnet-5, effort: max}
    terra: {family: openai, model: gpt-5.6-terra, effort: max}
  reviewers:
    sol: {family: openai, model: gpt-5.6-sol, effort: xhigh}
    opus: {family: anthropic, model: claude-opus-5, effort: high}
  routing:
    planner_primary: opus
    planner_escalation: sol
    worker_default: terra
    worker_by_risk: {mechanical: sonnet, novel: terra}
    reviewer_by_worker: {sonnet: sol, terra: opus}

checks:
  - name: pack-tests
    command: [just, test]
  - name: pack-validate
    command: [just, validate]

protected_paths:
  - .agents/skills/**
  - benchmarks/**
  - docs/vendored/**
  - template/repoctl/**
  - template/src/**
  - template/scripts/**
no_go_paths:
  - .venv/**
  - .jj/**
  - smithers.db
barriers: []

goal_tree:
  id: epic
  goal: >-
    Recursion is demonstrated, not asserted: the repository generates its own
    successors, across shapes, in any order, without ever losing a product byte.
  children:
    - id: harness
      goal: >-
        One acceptance harness drives the real CLI through the full generation
        chain and offers a single documented seam for shape fixtures, so no
        fixture reimplements the walk.
      children:
        - {id: task-recursive-acceptance-harness, task: recursive_acceptance_harness}
    - id: shapes
      goal: >-
        The template's claim to support any application shape is tested by five
        independent fixtures, each created through the real CLI, each proving the
        one thing its shape is supposed to make hard.
      children:
        - {id: task-fixture-pure-library, task: fixture_pure_library}
        - {id: task-fixture-stateful-workflow, task: fixture_stateful_workflow}
        - {id: task-fixture-cli-capability, task: fixture_cli_capability}
        - {id: task-fixture-external-integration, task: fixture_external_integration}
        - {id: task-fixture-composition, task: fixture_composition}
    - id: adversarial
      goal: >-
        The suite is shown to be non-vacuous and the system is shown to hold under
        scale, reordering, and a foundation update.
      children:
        - {id: task-mutation-catalog, task: mutation_catalog}
        - {id: task-commutativity-and-scale, task: commutativity_and_scale}
        - {id: task-update-preservation-generated, task: update_preservation_generated}
    - id: handover
      goal: The exact agent workflow for adding a capability is written from what the harness actually does.
      children:
        - {id: task-agent-workflow-doc, task: agent_workflow_doc}

tasks:
  recursive_acceptance_harness:
    repo: feltroidprime/python-design-guardrails-pack
    issue: feltroidprime/python-design-guardrails-pack#64
    outcome: >-
      One acceptance test walks template to N0 to N1 to N2 through the real
      control-plane CLI, executing the specification's nineteen steps, and exposes
      one documented seam for injecting a shape fixture.
    decision_boundary: >-
      Owns the harness structure, the fixture injection seam, and how the walk is
      staged and cached. May not change any production behavior, and may not
      substitute direct file writes for a CLI invocation at any step.
    interfaces: [recursive-harness-v1, repoctl-cli-v1]
    uncertainty: high
    depends_on: []
    risk: novel
    lane:
      - tests/recursive/harness.py
      - tests/recursive/test_recursive_generation.py
    forbidden_paths: []
    acceptance_criteria:
      - "`just test` passes with tests/recursive/test_recursive_generation.py collected and green."
      - "The test executes all nineteen specification steps in order, and a test asserts the recorded step list matches the specification's list exactly."
      - "Every capability creation step runs `python -m repoctl`; a test asserts the harness performs no direct write under a product root."
      - "The harness asserts alpha's product file hashes are unchanged after beta is applied, after beta is activated, and after alpha is retired."
      - "The harness asserts the derived runtime index contains beta and not alpha at the end of the walk."
      - "The harness asserts a freshly applied capability contains no invented business logic, by grepping for NotImplementedError, entity-shaped class names, and always-true assertions."
    required_checks: [pack-tests, pack-validate]
    done_artifacts:
      - tests/recursive/harness.py

  fixture_pure_library:
    repo: feltroidprime/python-design-guardrails-pack
    issue: feltroidprime/python-design-guardrails-pack#68
    outcome: >-
      A pure library capability created through the real CLI reaches ACTIVE with
      no adapters, and CrossHair analyses its pure functions.
    decision_boundary: >-
      Owns this fixture's minimal real implementation and its properties. May not
      modify the harness seam and may not ship the fixture in a generated
      repository.
    interfaces: [recursive-harness-v1, shape-fixture-v1]
    uncertainty: medium
    depends_on: [recursive_acceptance_harness]
    risk: novel
    lane:
      - tests/fixtures/shapes/pure_library/**
      - tests/recursive/test_shape_pure_library.py
    forbidden_paths: [tests/recursive/harness.py]
    acceptance_criteria:
      - "`pytest -q tests/recursive/test_shape_pure_library.py` passes."
      - "The capability reaches status active through `python -m repoctl capability activate`, with no module under its adapters directories."
      - "`uv run python -m scripts.crosshair_gate fast` reports at least one analysed target inside the fixture capability."
      - "A test asserts the fixture's api.py is the only module any external code imports."
      - "A pack test asserts no path under tests/fixtures/shapes/ appears in a generated repository."
    required_checks: [pack-tests, pack-validate]
    done_artifacts:
      - tests/recursive/test_shape_pure_library.py

  fixture_stateful_workflow:
    repo: feltroidprime/python-design-guardrails-pack
    issue: feltroidprime/python-design-guardrails-pack#69
    outcome: >-
      A stateful workflow capability created through the real CLI reaches ACTIVE
      with explicit transitions proven by a Hypothesis state machine and with clock
      and execution injected through ports.
    decision_boundary: >-
      Owns this fixture's state model, its ports, and its properties. May not
      modify the harness seam, and may not read a wall clock or generate an
      identifier outside an injected port.
    interfaces: [recursive-harness-v1, shape-fixture-v1]
    uncertainty: medium
    depends_on: [recursive_acceptance_harness]
    risk: novel
    lane:
      - tests/fixtures/shapes/stateful_workflow/**
      - tests/recursive/test_shape_stateful_workflow.py
    forbidden_paths: [tests/recursive/harness.py]
    acceptance_criteria:
      - "`pytest -q tests/recursive/test_shape_stateful_workflow.py` passes and the capability reaches status active."
      - "The fixture's RuleBasedStateMachine covers a retry sequence and a cancellation sequence, and asserts a terminal run is closed."
      - "`uv run python -m scripts.architecture_guard` reports ARCH011 or ARCH012 when the fixture's domain is mutated to read the wall clock, proving the ports are load-bearing."
      - "A test asserts the fixture declares clock and execution ports in its capability declaration's outbound boundaries."
    required_checks: [pack-tests, pack-validate]
    done_artifacts:
      - tests/recursive/test_shape_stateful_workflow.py

  fixture_cli_capability:
    repo: feltroidprime/python-design-guardrails-pack
    issue: feltroidprime/python-design-guardrails-pack#66
    outcome: >-
      A CLI capability created through the real CLI contributes its commands to
      the generated product catalog when active and disappears from it when
      retired.
    decision_boundary: >-
      Owns this fixture's command catalog and its process cases. May not modify the
      harness seam or the derived index format.
    interfaces: [recursive-harness-v1, shape-fixture-v1, product-cli-v1]
    uncertainty: medium
    depends_on: [recursive_acceptance_harness]
    risk: novel
    lane:
      - tests/fixtures/shapes/cli_capability/**
      - tests/recursive/test_shape_cli_capability.py
    forbidden_paths: [tests/recursive/harness.py]
    acceptance_criteria:
      - "`pytest -q tests/recursive/test_shape_cli_capability.py` passes."
      - "After activation, `python -m <package> capabilities` lists the fixture's command; after retirement, the same invocation does not, and both are asserted from real detached-process output."
      - "The fixture's command has an independent detached-process case with stdin closed, and activation is refused when that case is removed."
      - "A test asserts the generated product CLI index changed only under the derived root across activation."
    required_checks: [pack-tests, pack-validate]
    done_artifacts:
      - tests/recursive/test_shape_cli_capability.py

  fixture_external_integration:
    repo: feltroidprime/python-design-guardrails-pack
    issue: feltroidprime/python-design-guardrails-pack#67
    outcome: >-
      An external integration capability created through the real CLI reaches
      ACTIVE with an application-owned port, a fake adapter, a real adapter
      certified by one shared contract, and translated failures.
    decision_boundary: >-
      Owns this fixture's port, its two adapters, and its failure translation. May
      not modify the harness seam, and may not let a third-party exception escape
      the adapter boundary.
    interfaces: [recursive-harness-v1, shape-fixture-v1, port-contract-kit-v1]
    uncertainty: medium
    depends_on: [recursive_acceptance_harness]
    risk: novel
    lane:
      - tests/fixtures/shapes/external_integration/**
      - tests/recursive/test_shape_external_integration.py
    forbidden_paths: [tests/recursive/harness.py]
    acceptance_criteria:
      - "`pytest -q tests/recursive/test_shape_external_integration.py` passes and the capability reaches status active."
      - "One shared contract suite runs against both the fake and the real adapter, and a test asserts both executed the same case count."
      - "A test injects a transport failure into the real adapter and asserts the caller sees the capability's own named error, not the underlying exception type."
      - "Activation is refused when the port has no behavioral contract, demonstrated by temporarily removing the contract registration."
    required_checks: [pack-tests, pack-validate]
    done_artifacts:
      - tests/recursive/test_shape_external_integration.py

  fixture_composition:
    repo: feltroidprime/python-design-guardrails-pack
    issue: feltroidprime/python-design-guardrails-pack#72
    outcome: >-
      Two capabilities compose through a consumer-owned port injected by the outer
      bootstrap, with the consumer importing none of the provider's internals.
    decision_boundary: >-
      Owns the two fixtures' seam and the composition wiring. May not change the
      generated composition index format, and may not let the consumer import
      anything but the provider's api.py.
    interfaces: [recursive-harness-v1, shape-fixture-v1, generated-composition-v1]
    uncertainty: high
    depends_on: [fixture_pure_library, fixture_external_integration]
    risk: novel
    lane:
      - tests/fixtures/shapes/composition/**
      - tests/recursive/test_shape_composition.py
    forbidden_paths: [tests/recursive/harness.py]
    acceptance_criteria:
      - "`pytest -q tests/recursive/test_shape_composition.py` passes with both capabilities active and one real scenario executing across them."
      - "A test parses the consumer's imports and asserts it imports only the provider's api module; adding an import of the provider's domain makes the architecture guard fail."
      - "The generated composition index wires the provider into the consumer, and a test asserts the wiring comes from the derived file rather than hand-written code."
      - "Retiring the provider makes the composition index drop the wiring, and the consumer's product files stay byte-identical."
    required_checks: [pack-tests, pack-validate]
    done_artifacts:
      - tests/recursive/test_shape_composition.py

  mutation_catalog:
    repo: feltroidprime/python-design-guardrails-pack
    issue: feltroidprime/python-design-guardrails-pack#70
    outcome: >-
      Each of the fourteen mandatory mutations is temporarily introduced, caught by
      a named deterministic mechanism, and recorded in a machine-readable catalog.
    decision_boundary: >-
      Owns how mutations are applied and reverted and the catalog's format. May not
      leave a mutation in the tree, may not add a check purely to catch a mutation,
      and may not mark a mutation caught by a non-deterministic mechanism.
    interfaces: [recursive-harness-v1, mutation-catalog-v1]
    uncertainty: high
    depends_on: [recursive_acceptance_harness]
    risk: novel
    lane:
      - tests/mutations/**
      - tests/fixtures/mutation_catalog.json
    forbidden_paths: [tests/recursive/harness.py]
    acceptance_criteria:
      - "`pytest -q tests/mutations` passes and reports fourteen mutations, each applied and reverted."
      - "tests/fixtures/mutation_catalog.json contains one entry per mutation naming the mutation, the mechanism that caught it, and the exact failing command."
      - "A test asserts the catalog covers exactly the fourteen mutations listed in the specification, by identifier, and fails if one is missing."
      - "A test asserts the working tree is byte-identical before and after the mutation suite runs."
      - "For each mutation, the recorded mechanism is one of the guards, the proof gate, CrossHair, a Hypothesis property, or a contract test, and never a manual review step."
    required_checks: [pack-tests, pack-validate]
    done_artifacts:
      - tests/fixtures/mutation_catalog.json

  commutativity_and_scale:
    repo: feltroidprime/python-design-guardrails-pack
    issue: feltroidprime/python-design-guardrails-pack#65
    outcome: >-
      Independent capability order is metamorphically irrelevant, and the
      specification's performance budgets are measured and recorded at one hundred
      capabilities.
    decision_boundary: >-
      Owns the metamorphic property's canonical state comparison and how budgets
      are measured and reported. May not change any production behavior, and may
      not turn a measured budget into a hard CI failure without recording the
      measurement environment.
    interfaces: [recursive-harness-v1, capability-plan-v1]
    uncertainty: high
    depends_on: [recursive_acceptance_harness]
    risk: novel
    lane:
      - tests/scale/**
      - tests/fixtures/performance_budgets.json
    forbidden_paths: [tests/recursive/harness.py]
    acceptance_criteria:
      - "REPOCTL::INDEPENDENT-CAPABILITIES-COMMUTE appears in the generated repository's proof report with a metamorphic Hypothesis property, and `just prove-one REPOCTL::INDEPENDENT-CAPABILITIES-COMMUTE` passes."
      - "A test applies two independent intents in both orders and asserts the canonical final state digests are equal, excluding journal timestamps."
      - "A test builds a repository holding one hundred capabilities and records the median wall time of status, capability plan, capability apply, and generate into tests/fixtures/performance_budgets.json together with the machine and Python version."
      - "The recorded medians are compared against the specification's budgets and the comparison result is reported; a budget miss is reported as a recorded regression rather than as a flaky failure, and the reporting rule is stated in the test module docstring."
      - "A test asserts no measured operation opened a network socket, using the existing socket-disabling plugin."
    required_checks: [pack-tests, pack-validate]
    done_artifacts:
      - tests/fixtures/performance_budgets.json

  update_preservation_generated:
    repo: feltroidprime/python-design-guardrails-pack
    issue: feltroidprime/python-design-guardrails-pack#71
    outcome: >-
      The foundation-update preservation test runs over capabilities created by
      the real CLI rather than hand-seeded fixtures, and still proves byte-for-byte
      product preservation.
    decision_boundary: >-
      Owns how the generated capabilities replace the hand-seeded fixture in the
      existing preservation test. May not weaken the byte-for-byte comparison and
      may not delete the test's coverage of modified seeded files.
    interfaces: [recursive-harness-v1, shape-fixture-v1]
    uncertainty: medium
    depends_on: [recursive_acceptance_harness]
    risk: mechanical
    lane:
      - tests/test_update_preservation.py
    forbidden_paths: [tests/recursive/harness.py, template/**]
    acceptance_criteria:
      - "`pytest -q tests/test_update_preservation.py` passes with every capability created through `python -m repoctl capability apply`."
      - "The test modifies every seeded product file before the synthetic update and compares SHA-256 before and after for each one."
      - "A test asserts the hand-seeded fixture path is no longer referenced, so the coverage moved rather than being duplicated."
      - "A deliberate mutation making the synthetic update overwrite one product file makes the test fail."
    required_checks: [pack-tests, pack-validate]
    done_artifacts:
      - tests/test_update_preservation.py

  agent_workflow_doc:
    repo: feltroidprime/python-design-guardrails-pack
    issue: feltroidprime/python-design-guardrails-pack#73
    outcome: >-
      The downstream agent contract documents the exact command sequence for
      adding, implementing, proving, activating, and retiring a capability, with
      every command verified against the harness.
    decision_boundary: >-
      Owns the wording and the placement of the workflow. May not change any
      command or guard, and may not document a step the harness does not perform.
    interfaces: [recursive-harness-v1, repoctl-cli-v1]
    uncertainty: low
    depends_on: [fixture_composition, mutation_catalog, commutativity_and_scale]
    risk: mechanical
    lane:
      - template/docs/**
      - template/README.md.jinja
      - README.md
      - DESIGN_GUARDRAILS.md
      - VALIDATION.md
    forbidden_paths: [tests/recursive/**, template/repoctl/**]
    acceptance_criteria:
      - "In the generated repository, `uv run python -m scripts.docs_guard` exits 0."
      - "A pack test extracts every command shown in the workflow documentation and asserts each appears in the recursive harness's recorded invocation log."
      - "`just validate` passes."
      - "VALIDATION.md records a dated full `just validate` run with the actual environment and result."
      - "DESIGN_GUARDRAILS.md maps the recursive acceptance test, the shape matrix, and the mutation catalog to the design intent each certifies."
    required_checks: [pack-tests, pack-validate]
    done_artifacts:
      - VALIDATION.md
