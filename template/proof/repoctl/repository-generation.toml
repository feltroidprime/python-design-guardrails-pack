schema_version = 1
ownership_zone = "foundation"

[[properties]]
id = "REPOCTL::DERIVED-INDEX-EXACT"
title = "Derived capability indexes contain exactly active declarations"
statement = "Compilation includes every active declaration exactly once and excludes every draft, retired, or undeclared capability."
scope = "The pure compile_indexes projection over explicitly supplied capability declarations."
assumptions = ["Capability declarations are immutable validated values."]
kind = "model"
strength = "normative"
targets = ["repoctl.modules.repository_generation.domain.indexes:compile_indexes"]
oracles = ["repoctl.modules.repository_generation.domain.specifications:derived_indexes_are_exact"]
evidence = ["icontract", "hypothesis", "crosshair", "falsifier"]
crosshair_targets = ["repoctl.modules.repository_generation.domain.indexes:compile_indexes"]
counterexample = "A draft or retired declaration appears, or one active declaration is missing or duplicated."
failure_modes = ["missing active capability", "duplicate capability", "draft capability exposed", "retired capability exposed", "undeclared capability exposed"]

[[properties]]
id = "REPOCTL::PLAN-PATH-CLOSED"
title = "Every classified plan path is repository-relative and singly owned"
statement = "Successful classification returns the one declared ownership zone containing a canonical repository-relative path."
scope = "The pure repository-generation path classifier over one explicitly supplied ownership-root table."
assumptions = ["Ownership roots come from the validated architecture declaration and are pairwise disjoint."]
kind = "invariant"
strength = "normative"
targets = ["repoctl.modules.repository_generation.domain.ownership:classify_path"]
oracles = ["repoctl.modules.repository_generation.domain.specifications:classified_path_is_closed"]
evidence = ["icontract", "hypothesis", "crosshair", "falsifier"]
crosshair_targets = ["repoctl.modules.repository_generation.domain.ownership:classify_path"]
counterexample = "An absolute, escaping, non-canonical, unowned, or multiply owned path receives an ownership zone."
failure_modes = ["absolute path accepted", "parent escape accepted", "empty segment normalized away", "Unicode variant normalized silently", "unowned path accepted", "ambiguous zone accepted"]

[[properties]]
id = "REPOCTL::PLAN-DETERMINISTIC"
title = "Capability planning is a pure deterministic function of snapshot and intent"
statement = "The same canonical repository snapshot and capability intent produce byte-identical plans with the same content-derived plan ID."
scope = "The repository-generation plan decision over immutable explicit snapshot and intent values."
assumptions = ["The snapshot carries the validated ownership-root declaration and exact prior file digests."]
kind = "model"
strength = "normative"
targets = ["repoctl.modules.repository_generation.domain.decisions:plan"]
oracles = ["repoctl.modules.repository_generation.domain.specifications:plan_repetition_is_identical"]
evidence = ["icontract", "hypothesis", "crosshair", "falsifier"]
crosshair_targets = ["repoctl.modules.repository_generation.domain.decisions:plan"]
counterexample = "Two calls with the same snapshot and intent differ in bytes or plan ID."
failure_modes = ["hidden environment input", "filesystem-order dependence", "unstable operation order", "missing precondition", "hidden write", "unstable plan ID"]
