schema_version = 1
ownership_zone = "foundation"

[[properties]]
id = "REPOCTL::ACTIVATION-CLOSED"
title = "Activation requires every current evidence item"
statement = "A DRAFT or RETIRED capability remains non-active when any required activation evidence item is absent."
scope = "Activation attempts through the repository-generation lifecycle application boundary."
assumptions = ["The caller supplies current evidence from the architecture, proof, port, and CLI checks."]
kind = "state_machine"
strength = "normative"
targets = ["repoctl.modules.repository_generation.application.lifecycle:activate"]
oracles = ["repoctl.modules.repository_generation.application.specifications:activation_is_closed"]
evidence = ["hypothesis-stateful", "falsifier"]
counterexample = "An activation with a missing evidence item writes ACTIVE state or omits that item from its structured refusal."
failure_modes = ["activation without architecture contract", "activation without stable surface", "activation without normative evidence", "activation without port contract", "activation without CLI process evidence"]

[[properties]]
id = "REPOCTL::RETIREMENT-NON-DESTRUCTIVE"
title = "Retirement preserves product bytes"
statement = "Retiring an ACTIVE capability records RETIRED state while preserving every PRODUCT file byte-for-byte."
scope = "Retirement attempts through the repository-generation lifecycle application boundary."
assumptions = ["The repository port provides an atomic compare-and-swap write for the declaration."]
kind = "state_machine"
strength = "normative"
targets = ["repoctl.modules.repository_generation.application.lifecycle:retire"]
oracles = ["repoctl.modules.repository_generation.application.specifications:retirement_is_non_destructive"]
evidence = ["hypothesis-stateful", "falsifier"]
counterexample = "Retirement changes a PRODUCT file or fails to leave the declaration in RETIRED state."
failure_modes = ["product file rewritten", "declaration missing", "retirement not recorded"]
