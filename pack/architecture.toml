[project]
# No package name here. `src/` holds exactly one directory and that directory
# is the package, so this file stays byte-identical in every project.
source_root = "src"
profile = "system"

# Ownership is not declared here. `pack/scripts/ownership.py` states the two
# zones as one total predicate, so no path list can drift from the tree.

[limits]
max_module_lines = 650
max_test_module_lines = 500
max_function_lines = 60
max_class_lines = 250

[conventions]
forbidden_module_stems = ["utils", "helpers", "common", "misc"]
exception_marker = "ARCH-EXCEPTION: ADR-"

[domain]
package = "domain"
immutable_module_stems = ["entities", "events", "intents", "plans", "value_objects"]
forbidden_import_roots = [
  "aiohttp",
  "asyncio",
  "concurrent",
  "django",
  "fastapi",
  "flask",
  "httpx",
  "logging",
  "multiprocessing",
  "os",
  "pathlib",
  "random",
  "requests",
  "secrets",
  "socket",
  "sqlalchemy",
  "subprocess",
  "sys",
  "threading",
  "time",
  "urllib",
]
forbidden_call_suffixes = [
  "date.today",
  "datetime.now",
  "datetime.utcnow",
  "open",
  "input",
  "print",
  "random",
  "randint",
  "randrange",
  "time",
  "time_ns",
  "uuid1",
  "uuid4",
]
