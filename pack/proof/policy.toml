schema_version = 2

# This policy is the repository's single proof-system configuration. Catalogs
# own laws; this file owns the shared discovery and catalog-layout rules.
# Every root is relative to the repository root, not to `pack/`.
[policy]
source_roots = ["src", "pack"]
test_roots = ["pack/verification"]
# Behavior roots are relative to the package. The loader puts the derived
# package name in front of each one, so this file names no package.
behavior_roots = ["_foundation"]
excluded_module_stems = ["__init__", "errors", "specifications"]
oracle_module_stems = ["ownership_specifications"]

# A catalog's declared ownership_zone must agree with the location that
# discovers it. Empty directories are allowed so a future capability can add
# an empty catalog before it owns any public behavior.
[catalogs]
foundation = ["foundation.toml", "ownership.toml"]
product = ["modules"]
