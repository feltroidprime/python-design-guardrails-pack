name: quality gate
description: Provision the pinned toolchain and run the pack-owned quality gate.

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v9.0.0
      with:
        version: "0.12.0"
        python-version: "3.14"
        enable-cache: true
    - run: uv sync --locked --all-groups
      shell: bash
    - run: PYTHONPATH=pack uv run python pack/scripts/quality_gate.py
      shell: bash
