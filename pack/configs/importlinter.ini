; The one import-linter policy of the tree. The gate runs
; `lint-imports --config pack/configs/importlinter.ini` from the repository
; root.
;
; Ticket I4 writes the six contracts that carry the capability rules L1 to L4,
; and `pack/scripts/import_contracts.py` injects the package name and the
; discovered capability list. This file holds the shared settings until then.
;
; `root_package` below is the one identity token left under pack/, because
; import-linter reads the name from its config file and offers no flag for it.
; The I4 shim removes this line. Every other pack-owned file is name-blind.
[importlinter]
root_package = guardrails_pack
include_external_packages = False
exclude_type_checking_imports = True
