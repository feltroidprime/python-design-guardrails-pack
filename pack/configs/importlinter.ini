; The one import-linter policy of the tree. It carries capability rules L1 to
; L4 of #85 as six contracts, and it holds no rule logic anywhere else.
;
; This file is a template, not a runnable import-linter config. The gate runs
; `pack/scripts/import_contracts.py`, which reads it, injects two discovered
; values, and calls `lint-imports` on the result. Two substitutions exist:
;
;   {package}      the import package name, discovered from src/
;   {capability}   one discovered capability; the shim repeats each line that
;                  holds this token once per capability
;
; A contract section that holds {capability} is dropped when the project has no
; capability. Without that rule import-linter reads each layer name as a
; top-level module and breaks with "Missing layer 'api': module api does not
; exist" on a fresh project. Measured on import-linter 2.13.
;
; The template holds no identity token, so a pack update replaces it whole.

[importlinter]
root_package = {package}
include_external_packages = True
exclude_type_checking_imports = True

; --- L1 and L2: one directory per capability, and layers point inward. -------
; A declared layer that does not exist breaks this contract, and an empty
; directory counts as not existing. That is how a missing or empty layer fails.
[importlinter:contract:capability-layers]
name = Capability layers point inward
type = layers
layers =
    api
    adapters
    application
    domain
containers =
    {package}.{capability}

; --- L3: reach a capability through its api, never its internals. ------------
[importlinter:contract:capability-public-surface]
name = Capability internals are private
type = protected
protected_modules =
    {package}.{capability}.domain
    {package}.{capability}.application
    {package}.{capability}.adapters
allowed_importers =
    {package}.{capability}

; --- L4: a capability imports no sibling capability. -------------------------
; A cross-capability need becomes a Protocol port that the composition root
; injects.
[importlinter:contract:capability-independence]
name = Capabilities are independent
type = independence
modules =
    {package}.{capability}

; --- The pack-owned foundation is private. Fixed names only. -----------------
; Rule 4 of the capability contract: a capability imports no pack code.
[importlinter:contract:foundation-is-pack-owned]
name = The foundation is pack owned
type = protected
protected_modules =
    {package}._foundation
allowed_importers =
    {package}.cli
    {package}.composition

; --- The foundation imports one user module only: the composition root. ------
[importlinter:contract:foundation-imports-only-composition]
name = The foundation imports no user module but composition
type = forbidden
source_modules =
    {package}._foundation
forbidden_modules =
    {package}.cli

; --- A domain layer stays pure. ----------------------------------------------
; The wildcard needs no injection: it matches every capability, and it matches
; nothing on a project with no capability. Measured on import-linter 2.13.
[importlinter:contract:domain-is-pure]
name = Domain imports no infrastructure root
type = forbidden
source_modules =
    {package}.*.domain
forbidden_modules =
    http
    socket
    sqlite3
    subprocess
    urllib
include_external_packages = True
