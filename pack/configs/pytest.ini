[pytest]
# The one pytest policy of the tree. The gate runs
# `pytest -c pack/configs/pytest.ini --rootdir=.` from the repository root.
# `--rootdir=.` is load-bearing: without it pytest derives the root directory
# from this file, and every relative path below resolves under pack/configs/.
#
# No coverage assertion exists here, and none is allowed in the pack or in a
# projected project. Conflict C10 of the decision of record settles it.
minversion = 9.1
testpaths = pack/tests pack/verification/tests
# Test packages are namespace packages (PEP 420): no __init__.py under tests/
# (enforced by ARCH014). The repository root and pack/ on sys.path plus
# namespace detection keep `tests.*` and `scripts.*` imports working.
consider_namespace_packages = true
# pytest resolves a `paths` option against the directory of this file, and an
# `args` option such as testpaths against the root directory. Hence the two
# spellings below. Measured on pytest 9.1.
pythonpath = ../.. ../../pack
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} scratch docs
addopts = -ra --strict-config --strict-markers --disable-socket -m "not session_e2e"
markers =
    acceptance: end-to-end assertion that runs from the installed console script
    contract: shared behavioral contract for a port implementation
    integration: deterministic integration test across real local components
    proof: canonical executable evidence owned by the proof catalog tree
    proves(id): one broad Hypothesis proof for a stable property ID
    falsifies(id): one minimal canary demonstrating that a property is non-vacuous
    stateful: Hypothesis RuleBasedStateMachine proof of a protocol
    session_e2e: opt-in conversion of private Claude Code and Codex session logs
xfail_strict = true
